name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests & lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: vision-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: install.sh scripts/claude-ds.sh scripts/vision-guard.sh

  install-smoke:
    name: install.sh smoke test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq + mock claude CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          # Mock claude CLI for CI: echoes resolved env to verify install.sh wiring
          echo "mock-claude args=$*"
          echo "ANTHROPIC_MODEL=$ANTHROPIC_MODEL"
          echo "ANTHROPIC_SMALL_FAST_MODEL=$ANTHROPIC_SMALL_FAST_MODEL"
          echo "ANTHROPIC_BASE_URL=$ANTHROPIC_BASE_URL"
          EOF
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run install.sh non-interactively (skip vision)
        env:
          DEEPSEEK_API_KEY: ci-fake-deepseek-key
        run: |
          # Empty input on the vision-key prompt skips vision setup
          printf '\n' | bash ./install.sh

      - name: Verify shell functions are sourced and model mapping is correct
        env:
          DEEPSEEK_API_KEY: ci-fake-deepseek-key
        run: |
          # Debug: show what install.sh actually wrote where, so any
          # future failure here is diagnosable from the log alone.
          echo "=== $HOME contents ==="
          ls -la "$HOME" | grep -E '\.(bash|zsh|profile)' || true
          for f in "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.bash_profile" "$HOME/.profile"; do
            if [ -f "$f" ]; then
              echo "--- tail -10 $f ---"
              tail -10 "$f"
            fi
          done
          echo "===================="

          # Part 1: locate the RC file install.sh wrote to.
          # We don't `source ~/.bashrc` because Ubuntu's default .bashrc
          # returns early in non-interactive shells (the case-$- guard),
          # so the appended `source ...claude-ds.sh` line never executes.
          RC_FILE=""
          for candidate in "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.bash_profile"; do
            if [ -f "$candidate" ] && grep -q "claude-ds\.sh" "$candidate"; then
              RC_FILE="$candidate"
              break
            fi
          done
          if [ -z "$RC_FILE" ]; then
            echo "FAIL: no RC file contains 'claude-ds.sh'"
            exit 1
          fi
          echo "[ok] install entry found in $RC_FILE"

          # Part 2: source claude-ds.sh directly to verify env-var wiring.
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/scripts/claude-ds.sh"
          type claude-ds
          type claude-ds-flash

          out=$(claude-ds --print probe)
          echo "$out"
          echo "$out" | grep -q "ANTHROPIC_MODEL=deepseek-v4-pro\[1m\]"
          echo "$out" | grep -q "ANTHROPIC_SMALL_FAST_MODEL=deepseek-v4-flash"
          echo "$out" | grep -q "ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic"
          flash_out=$(claude-ds-flash --print probe)
          echo "$flash_out" | grep -q "ANTHROPIC_MODEL=deepseek-v4-flash"

      - name: Run uninstall and verify cleanup
        run: |
          bash ./install.sh --uninstall
          ! grep -q "claude-ds.sh" "$HOME/.bashrc" 2>/dev/null
          ! grep -q "claude-ds.sh" "$HOME/.zshrc" 2>/dev/null
